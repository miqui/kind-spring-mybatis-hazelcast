apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-json
  namespace: observability
  labels:
    app: grafana
data:
  openobserve-ops.json: |
    {
      "title": "OpenObserve Ops",
      "uid": "openobserve-ops",
      "timezone": "browser",
      "schemaVersion": 39,
      "refresh": "10s",
      "time": { "from": "now-30m", "to": "now" },
      "panels": [
        {
          "id": 1,
          "title": "OpenObserve Up",
          "type": "stat",
          "gridPos": { "h": 4, "w": 4, "x": 0, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "expr": "up{job=\"openobserve\"}", "refId": "A" }
          ],
          "fieldConfig": {
            "defaults": {
              "mappings": [
                { "type": "value", "options": { "0": { "text": "DOWN", "color": "red" }, "1": { "text": "UP", "color": "green" } } }
              ]
            }
          }
        },
        {
          "id": 2,
          "title": "Disk Usage",
          "type": "gauge",
          "gridPos": { "h": 4, "w": 4, "x": 4, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "unit": "percent", "min": 0, "max": 100,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 70 },
                  { "color": "red", "value": 85 }
                ]
              }
            }
          },
          "targets": [
            { "expr": "zo_node_disk_usage{job=\"openobserve\"} / zo_node_disk_total{job=\"openobserve\"} * 100", "refId": "A" }
          ]
        },
        {
          "id": 3,
          "title": "Process Memory (RSS)",
          "type": "stat",
          "gridPos": { "h": 4, "w": 4, "x": 8, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "bytes" } },
          "targets": [
            { "expr": "process_resident_memory_bytes{job=\"openobserve\"}", "refId": "A" }
          ]
        },
        {
          "id": 4,
          "title": "Open File Descriptors",
          "type": "stat",
          "gridPos": { "h": 4, "w": 4, "x": 12, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "expr": "process_open_fds{job=\"openobserve\"}", "refId": "A" }
          ]
        },
        {
          "id": 5,
          "title": "Uptime",
          "type": "stat",
          "gridPos": { "h": 4, "w": 4, "x": 16, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "s" } },
          "targets": [
            { "expr": "time() - process_start_time_seconds{job=\"openobserve\"}", "refId": "A" }
          ]
        },
        {
          "id": 6,
          "title": "Ingest Rate (records/s)",
          "type": "stat",
          "gridPos": { "h": 4, "w": 4, "x": 20, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "ops" } },
          "targets": [
            { "expr": "sum(rate(zo_ingest_records{job=\"openobserve\"}[5m]))", "refId": "A" }
          ]
        },
        {
          "id": 7,
          "title": "HTTP Request Rate by Endpoint",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 4 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "ops" } },
          "targets": [
            { "expr": "sum(rate(zo_http_incoming_requests{job=\"openobserve\"}[5m])) by (endpoint, status)", "legendFormat": "{{endpoint}} ({{status}})", "refId": "A" }
          ]
        },
        {
          "id": 8,
          "title": "HTTP Response Time p95/p99 by Endpoint",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 4 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "s" } },
          "targets": [
            { "expr": "histogram_quantile(0.95, sum(rate(zo_http_response_time_bucket{job=\"openobserve\"}[5m])) by (le, endpoint))", "legendFormat": "p95 {{endpoint}}", "refId": "A" },
            { "expr": "histogram_quantile(0.99, sum(rate(zo_http_response_time_bucket{job=\"openobserve\"}[5m])) by (le, endpoint))", "legendFormat": "p99 {{endpoint}}", "refId": "B" }
          ]
        },
        {
          "id": 9,
          "title": "Ingest Rate by Stream Type (records/s)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 12 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "ops" } },
          "targets": [
            { "expr": "sum(rate(zo_ingest_records{job=\"openobserve\"}[5m])) by (stream_type)", "legendFormat": "{{stream_type}}", "refId": "A" }
          ]
        },
        {
          "id": 10,
          "title": "Ingest Rate by Stream Type (bytes/s)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 12 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "Bps" } },
          "targets": [
            { "expr": "sum(rate(zo_ingest_bytes{job=\"openobserve\"}[5m])) by (stream_type)", "legendFormat": "{{stream_type}}", "refId": "A" }
          ]
        },
        {
          "id": 11,
          "title": "In-Memory MemTable Size",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 20 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "bytes" } },
          "description": "Watch this against OpenObserve's memory limit (see k8s/observability/openobserve-values.yaml resources.limits.memory) - this is what overflowed (HTTP 400 MemoryTableOverflowError) before remote_write was scoped down / OpenObserve's resources were bumped.",
          "targets": [
            { "expr": "zo_ingest_memtable_bytes{job=\"openobserve\"}", "legendFormat": "memtable", "refId": "A" }
          ]
        },
        {
          "id": 12,
          "title": "WAL Used Bytes by Stream Type",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 20 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "bytes" } },
          "targets": [
            { "expr": "sum(zo_ingest_wal_used_bytes{job=\"openobserve\"}) by (stream_type)", "legendFormat": "{{stream_type}}", "refId": "A" }
          ]
        },
        {
          "id": 13,
          "title": "Process CPU Usage",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 28 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "percent" } },
          "targets": [
            { "expr": "rate(process_cpu_seconds_total{job=\"openobserve\"}[5m]) * 100", "legendFormat": "cpu", "refId": "A" }
          ]
        },
        {
          "id": 14,
          "title": "Disk Usage vs Total",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 28 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "bytes" } },
          "targets": [
            { "expr": "zo_node_disk_usage{job=\"openobserve\"}", "legendFormat": "used", "refId": "A" },
            { "expr": "zo_node_disk_total{job=\"openobserve\"}", "legendFormat": "total", "refId": "B" }
          ]
        }
      ]
    }
  message-service.json: |
    {
      "title": "message-service",
      "uid": "message-service",
      "timezone": "browser",
      "schemaVersion": 39,
      "refresh": "10s",
      "time": { "from": "now-15m", "to": "now" },
      "panels": [
        {
          "id": 1,
          "title": "Service Up",
          "type": "stat",
          "gridPos": { "h": 4, "w": 4, "x": 0, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "expr": "up{job=\"otel-collector\"}", "refId": "A" }
          ],
          "fieldConfig": {
            "defaults": {
              "mappings": [
                { "type": "value", "options": { "0": { "text": "DOWN", "color": "red" }, "1": { "text": "UP", "color": "green" } } }
              ]
            }
          }
        },
        {
          "id": 2,
          "title": "Active DB Connections (HikariCP)",
          "type": "stat",
          "gridPos": { "h": 4, "w": 4, "x": 4, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "expr": "hikaricp_connections_active", "refId": "A" }
          ]
        },
        {
          "id": 3,
          "title": "Process CPU Usage",
          "type": "gauge",
          "gridPos": { "h": 4, "w": 4, "x": 8, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": { "unit": "percentunit", "min": 0, "max": 1 }
          },
          "targets": [
            { "expr": "process_cpu_usage", "refId": "A" }
          ]
        },
        {
          "id": 4,
          "title": "JVM Live Threads",
          "type": "stat",
          "gridPos": { "h": 4, "w": 4, "x": 12, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "expr": "jvm_threads_live", "refId": "A" }
          ]
        },
        {
          "id": 5,
          "title": "HTTP Request Rate by Endpoint",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 4 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "reqps" } },
          "targets": [
            {
              "expr": "sum(rate(http_server_requests_milliseconds_count[1m])) by (uri, method, status)",
              "legendFormat": "{{method}} {{uri}} ({{status}})",
              "refId": "A"
            }
          ]
        },
        {
          "id": 6,
          "title": "HTTP Average Request Latency",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 4 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "ms" } },
          "targets": [
            {
              "expr": "sum(rate(http_server_requests_milliseconds_sum[1m])) by (uri) / sum(rate(http_server_requests_milliseconds_count[1m])) by (uri)",
              "legendFormat": "{{uri}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 7,
          "title": "JVM Heap Memory Used",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 12 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "bytes" } },
          "targets": [
            {
              "expr": "sum(jvm_memory_used_bytes{area=\"heap\"}) by (id)",
              "legendFormat": "{{id}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 8,
          "title": "GC Pause Time (rate)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 12 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "ms" } },
          "targets": [
            {
              "expr": "sum(rate(jvm_gc_pause_milliseconds_sum[5m])) by (action, cause)",
              "legendFormat": "{{action}} ({{cause}})",
              "refId": "A"
            }
          ]
        }
      ]
    }
  kind-cluster-ops.json: |
    {
      "title": "kind cluster ops",
      "uid": "kind-cluster-ops",
      "timezone": "browser",
      "schemaVersion": 39,
      "refresh": "10s",
      "time": { "from": "now-30m", "to": "now" },
      "panels": [
        {
          "id": 1,
          "title": "Nodes Ready",
          "type": "stat",
          "gridPos": { "h": 4, "w": 4, "x": 0, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "expr": "sum(kube_node_status_condition{condition=\"Ready\",status=\"true\"})", "refId": "A" }
          ]
        },
        {
          "id": 2,
          "title": "Pods Running",
          "type": "stat",
          "gridPos": { "h": 4, "w": 4, "x": 4, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "expr": "sum(kube_pod_status_phase{phase=\"Running\"})", "refId": "A" }
          ]
        },
        {
          "id": 3,
          "title": "Pod Restarts (1h)",
          "type": "stat",
          "gridPos": { "h": 4, "w": 4, "x": 8, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "expr": "sum(increase(kube_pod_container_status_restarts_total[1h]))", "refId": "A" }
          ],
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 1 },
                  { "color": "red", "value": 5 }
                ]
              }
            }
          }
        },
        {
          "id": 4,
          "title": "Pending / Failed / Unknown Pods",
          "type": "stat",
          "gridPos": { "h": 4, "w": 4, "x": 12, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "expr": "sum(kube_pod_status_phase{phase=~\"Pending|Failed|Unknown\"})", "refId": "A" }
          ],
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "red", "value": 1 }
                ]
              }
            }
          }
        },
        {
          "id": 5,
          "title": "Node CPU Usage",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 4 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "percent", "min": 0, "max": 100 } },
          "targets": [
            {
              "expr": "100 - (avg by (node) (rate(node_cpu_seconds_total{mode=\"idle\"}[5m])) * 100)",
              "legendFormat": "{{node}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 6,
          "title": "Node Memory Usage",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 4 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "percent", "min": 0, "max": 100 } },
          "targets": [
            {
              "expr": "(1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100",
              "legendFormat": "{{node}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 7,
          "title": "Node Disk Usage (/var)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 12 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "percent", "min": 0, "max": 100 } },
          "targets": [
            {
              "expr": "(1 - (node_filesystem_avail_bytes{mountpoint=\"/var\"} / node_filesystem_size_bytes{mountpoint=\"/var\"})) * 100",
              "legendFormat": "{{node}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 8,
          "title": "Pods by Phase",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 12 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "sum(kube_pod_status_phase) by (phase)",
              "legendFormat": "{{phase}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 9,
          "title": "Container CPU Usage by Namespace",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 20 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "sum(rate(container_cpu_usage_seconds_total{namespace!=\"\",container!=\"\"}[5m])) by (namespace)",
              "legendFormat": "{{namespace}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 10,
          "title": "Container Memory Usage by Namespace",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 20 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "bytes" } },
          "targets": [
            {
              "expr": "sum(container_memory_working_set_bytes{namespace!=\"\",container!=\"\"}) by (namespace)",
              "legendFormat": "{{namespace}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 11,
          "title": "Pod Restarts by Pod (15m increase)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 28 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "sum(increase(kube_pod_container_status_restarts_total[15m])) by (namespace, pod)",
              "legendFormat": "{{namespace}}/{{pod}}",
              "refId": "A"
            }
          ]
        }
      ]
    }
  jvm-gc.json: |
    {
      "title": "JVM & GC",
      "uid": "jvm-gc",
      "timezone": "browser",
      "schemaVersion": 39,
      "refresh": "10s",
      "time": { "from": "now-30m", "to": "now" },
      "panels": [
        { "id": 100, "title": "Heap & Memory", "type": "row", "gridPos": { "h": 1, "w": 24, "x": 0, "y": 0 } },
        {
          "id": 1,
          "title": "Heap Used by Region",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 1 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "bytes" } },
          "targets": [
            {
              "expr": "jvm_memory_used_bytes{area=\"heap\"}",
              "legendFormat": "{{k8s_pod_name}} - {{id}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 2,
          "title": "Non-Heap Memory (Metaspace / Code Cache)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 1 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "bytes" } },
          "targets": [
            {
              "expr": "jvm_memory_used_bytes{area=\"nonheap\"}",
              "legendFormat": "{{k8s_pod_name}} - {{id}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 3,
          "title": "Container Memory vs 1024Mi Limit",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 9 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "description": "JVM-GC.md target: stay below 85% of the pod's memory limit to avoid the cgroup OOM killer.",
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0,
              "max": 100,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 70 },
                  { "color": "red", "value": 85 }
                ]
              },
              "custom": { "thresholdsStyle": { "mode": "line" } }
            }
          },
          "targets": [
            {
              "expr": "sum(container_memory_working_set_bytes{namespace=\"default\",container=\"message-service\"}) by (pod) / sum(kube_pod_container_resource_limits{namespace=\"default\",container=\"message-service\",resource=\"memory\"}) by (pod) * 100",
              "legendFormat": "{{pod}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 4,
          "title": "Heap Usage vs Max (MaxRAMPercentage headroom)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 9 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "description": "JVM-GC.md recommends MaxRAMPercentage 70-75%, leaving headroom for Metaspace/threads/native memory.",
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0,
              "max": 100,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 75 },
                  { "color": "red", "value": 90 }
                ]
              },
              "custom": { "thresholdsStyle": { "mode": "line" } }
            }
          },
          "targets": [
            {
              "expr": "sum(jvm_memory_used_bytes{area=\"heap\"}) by (k8s_pod_name) / sum(jvm_memory_max_bytes{area=\"heap\"}) by (k8s_pod_name) * 100",
              "legendFormat": "{{k8s_pod_name}}",
              "refId": "A"
            }
          ]
        },
        { "id": 101, "title": "Garbage Collection", "type": "row", "gridPos": { "h": 1, "w": 24, "x": 0, "y": 17 } },
        {
          "id": 5,
          "title": "GC Pause Time (avg / max)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 18 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "description": "JVM-GC.md target: MaxGCPauseMillis=100 - max pause should stay near/below this line.",
          "fieldConfig": {
            "defaults": {
              "unit": "ms",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "red", "value": 100 }
                ]
              },
              "custom": { "thresholdsStyle": { "mode": "line" } }
            }
          },
          "targets": [
            {
              "expr": "jvm_gc_pause_max_milliseconds",
              "legendFormat": "{{k8s_pod_name}} max",
              "refId": "A"
            },
            {
              "expr": "sum(rate(jvm_gc_pause_milliseconds_sum[1m])) by (k8s_pod_name) / sum(rate(jvm_gc_pause_milliseconds_count[1m])) by (k8s_pod_name)",
              "legendFormat": "{{k8s_pod_name}} avg",
              "refId": "B"
            }
          ]
        },
        {
          "id": 6,
