  api-red.json: |
    {
      "title": "API RED & Saturation",
      "uid": "api-red",
      "timezone": "browser",
      "schemaVersion": 39,
      "refresh": "10s",
      "time": { "from": "now-30m", "to": "now" },
      "panels": [
        {
          "id": 1,
          "title": "Request Rate (RPS)",
          "type": "stat",
          "gridPos": { "h": 4, "w": 4, "x": 0, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "reqps" } },
          "targets": [
            { "expr": "sum(rate(http_server_requests_milliseconds_count{uri!~\"/actuator.*\"}[5m]))", "refId": "A" }
          ]
        },
        {
          "id": 2,
          "title": "p99 Latency",
          "type": "stat",
          "gridPos": { "h": 4, "w": 4, "x": 4, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "ms" } },
          "targets": [
            {
              "expr": "histogram_quantile(0.99, sum(rate(http_server_requests_milliseconds_bucket{uri!~\"/actuator.*\"}[5m])) by (le))",
              "refId": "A"
            }
          ]
        },
        {
          "id": 3,
          "title": "5xx Error Ratio",
          "type": "gauge",
          "gridPos": { "h": 4, "w": 4, "x": 8, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "min": 0,
              "max": 1,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 0.01 },
                  { "color": "red", "value": 0.05 }
                ]
              }
            }
          },
          "targets": [
            {
              "expr": "sum(rate(http_server_requests_milliseconds_count{uri!~\"/actuator.*\",outcome=\"SERVER_ERROR\"}[5m])) / sum(rate(http_server_requests_milliseconds_count{uri!~\"/actuator.*\"}[5m]))",
              "refId": "A"
            }
          ]
        },
        {
          "id": 4,
          "title": "In-Flight Requests",
          "type": "stat",
          "gridPos": { "h": 4, "w": 4, "x": 12, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "expr": "sum(http_server_requests_active_milliseconds_count)", "refId": "A" }
          ]
        },
        {
          "id": 5,
          "title": "Request Rate by Route & Method",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 4 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "reqps" } },
          "targets": [
            {
              "expr": "sum(rate(http_server_requests_milliseconds_count{uri!~\"/actuator.*\"}[5m])) by (method, uri)",
              "legendFormat": "{{method}} {{uri}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 6,
          "title": "Latency Percentiles",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 4 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "ms" } },
          "targets": [
            { "expr": "histogram_quantile(0.50, sum(rate(http_server_requests_milliseconds_bucket{uri!~\"/actuator.*\"}[5m])) by (le))", "legendFormat": "p50", "refId": "A" },
            { "expr": "histogram_quantile(0.90, sum(rate(http_server_requests_milliseconds_bucket{uri!~\"/actuator.*\"}[5m])) by (le))", "legendFormat": "p90", "refId": "B" },
            { "expr": "histogram_quantile(0.95, sum(rate(http_server_requests_milliseconds_bucket{uri!~\"/actuator.*\"}[5m])) by (le))", "legendFormat": "p95", "refId": "C" },
            { "expr": "histogram_quantile(0.99, sum(rate(http_server_requests_milliseconds_bucket{uri!~\"/actuator.*\"}[5m])) by (le))", "legendFormat": "p99", "refId": "D" }
          ]
        },
        {
          "id": 7,
          "title": "Request Rate by Outcome",
          "type": "timeseries",
